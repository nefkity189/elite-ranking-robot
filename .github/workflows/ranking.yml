name: Atualizar ranking

on:
  schedule:
    - cron: "*/5 * * * *"       # a cada 5 min (minimo permitido pelo GitHub; pode atrasar em horario de pico)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulacao (nao grava nada)"
        type: boolean
        default: true

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Rodar robo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/update-ranking.mjs
